<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Measured on 3,103 subagent runs: an Opus subagent costs 2 to 14 dollars per run against about 6 cents for Haiku; Opus was 95 percent of subagent spend; the main conversation was 72 percent of total cost">
  <rect width="960" height="330" rx="20" fill="#0d1117"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="50" font-size="22" font-weight="700" fill="#e6edf3">What 3,103 logged subagent runs showed</text>
    <text x="40" y="76" font-size="16" fill="#9da7b3">priced at API-equivalent rates</text>

    <!-- tile 1 -->
    <rect x="40" y="100" width="280" height="200" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="158" font-size="44" font-weight="800" fill="#fb7185">50–200×</text>
    <text x="64" y="190" font-size="17" font-weight="600" fill="#e6edf3">Opus vs Haiku, per run</text>
    <rect x="64" y="212" width="232" height="14" rx="7" fill="#fb7185"/>
    <text x="64" y="246" font-size="15" fill="#c9d1d9">Opus  $2–$14</text>
    <rect x="64" y="262" width="5" height="14" rx="2.5" fill="#2dd4bf"/>
    <text x="78" y="275" font-size="15" fill="#c9d1d9">Haiku  ~$0.06</text>

    <!-- tile 2 -->
    <rect x="340" y="100" width="280" height="200" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="364" y="158" font-size="44" font-weight="800" fill="#fbbf24">95%</text>
    <text x="364" y="190" font-size="17" font-weight="600" fill="#e6edf3">of subagent spend was Opus</text>
    <rect x="364" y="212" width="232" height="14" rx="7" fill="#30363d"/>
    <rect x="364" y="212" width="220" height="14" rx="7" fill="#fbbf24"/>
    <text x="364" y="252" font-size="15" fill="#c9d1d9">The cost is the cache re-read on</text>
    <text x="364" y="274" font-size="15" fill="#c9d1d9">every turn of a long run, not output.</text>

    <!-- tile 3 -->
    <rect x="640" y="100" width="280" height="200" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="664" y="158" font-size="44" font-weight="800" fill="#a78bfa">72%</text>
    <text x="664" y="190" font-size="17" font-weight="600" fill="#e6edf3">of total cost: main conversation</text>
    <rect x="664" y="212" width="232" height="14" rx="7" fill="#30363d"/>
    <rect x="664" y="212" width="167" height="14" rx="7" fill="#a78bfa"/>
    <text x="664" y="252" font-size="15" fill="#c9d1d9">Over 30 days. Long sessions re-read</text>
    <text x="664" y="274" font-size="15" fill="#c9d1d9">their whole context on every turn.</text>
  </g>
</svg>
